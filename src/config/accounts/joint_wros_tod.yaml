# =========================
# SECURITY → BUCKET MAPPING
# =========================
#
# Defines the approved investment bucket for each security within
# this account.
#
# The mapping is ACCOUNT-SPECIFIC. The same security may belong to
# different buckets in different accounts because each account may
# have a different investment strategy.
#
# Current positions are NOT maintained here. Current holdings and
# market values come from positions imported into PostgreSQL.
#
# If a position is imported and is not present in this mapping,
# CycleGuard will classify it as UNMAPPED and may recommend a bucket.
#
# CycleGuard does not automatically change this configuration.
# Approved changes require user action.
#
# Add approved security → bucket mappings below.
#
# =========================

bucket_mapping:

  # -------- Defensive / Cash --------

  # SGOV: defensive

  # -------- Fixed Income --------

  # Add approved fixed-income securities here.

  # -------- TIPS Ladder --------

  # Add approved TIPS ladder securities here.

  # -------- Core Equity --------

  # Add approved core-equity securities here.

  # -------- Equity Income --------

  # Add approved equity-income securities here.

  # -------- Equity Growth --------

  # Add approved equity-growth securities here.

  # -------- High Beta --------

  # Add approved high-beta securities here.

  # -------- Foreign Equity --------

  # Add approved foreign-equity securities here.

  # -------- Alternatives --------

  # Add approved alternative securities here.


# =========================
# TARGET BUCKET WEIGHTS
# =========================
#
# Defines the desired percentage of the total account value that
# should be allocated to each investment bucket.
#
# These are STRATEGY TARGETS, not current portfolio allocations.
# Current holdings and market values are obtained from positions
# imported into PostgreSQL.
#
# The bucket weights should total 100% (1.00).
#
# CycleGuard uses these targets to:
#   - calculate the desired allocation for each bucket
#   - compare target allocation with the current portfolio
#   - calculate bucket-level drift
#   - identify over- and under-weight buckets
#   - support rebalancing and deployment recommendations
#
# CycleGuard may recommend changes to these targets, but changes
# to the YAML require user approval.
#
# =========================

bucket_weights:

  defensive: 0.05

  fixed_income: 0.25

  tips_ladder: 0.05

  core_equity: 0.25

  equity_income: 0.15

  equity_growth: 0.10

  high_beta: 0.05

  foreign_equity: 0.07

  alternatives: 0.03


# =========================
# POSITION LIMITS
# =========================
#
# Defines the maximum percentage of the total account value that may
# be allocated to any single security.
#
# These are STRATEGY CONSTRAINTS, not current portfolio allocations.
# Current positions and market values are obtained from positions
# imported into PostgreSQL.
#
# max_position_pct:
#   Defines the default maximum position size for any security that
#   does not have a specific override.
#
# overrides:
#   Defines account-specific maximum position sizes for individual
#   securities that are intentionally allowed to differ from the
#   default maximum.
#
# =========================

position_limits:

  max_position_pct: 0.10

  overrides:

    SCHD: 0.15

    JEPI: 0.10

    JEPQ: 0.10

    SGOV: 0.20


# =========================
# ACCOUNT-SPECIFIC SETTINGS
# =========================
#
# Defines operational and trading behavior that applies specifically
# to this account.
#
# These settings do not describe the current portfolio and do not
# define the investment allocation. They tell CycleGuard how it is
# permitted to operate when analyzing, rebalancing, and deploying
# capital for this account.
#
# =========================

settings:

  rebalance_frequency: "monthly"

  allow_fractional_shares: true

  enable_recovery_trims: true

  enable_dynamic_deployment: true