version: 1

disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(filename)s: %(lineno)d | %(funcName)s | %(message)s"

  detailed:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(filename)s: %(lineno)d | %(funcName)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/cycleguard.log

loggers:
  app:
    level: DEBUG
    handlers: [console, file]
    propagate: false

root:
  level: DEBUG
  handlers: [console]



