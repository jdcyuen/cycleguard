# =========================
# CycleGuard Crash Deployment System
# Shared execution rules across ALL accounts
#
#Crash level	Market drawdown				Deploy % of available capital
#Level 1		−10%						3%
#Level 2		−20%						5%
#Level 3		−30%						8%
#Level 4		−40%						9%
# =========================

levels:

  level_1:
    drawdown: -0.10
    deploy_pct: 0.03

  level_2:
    drawdown: -0.20
    deploy_pct: 0.05

  level_3:
    drawdown: -0.30
    deploy_pct: 0.08

  level_4:
    drawdown: -0.40
    deploy_pct: 0.09

# =========================
# DEPLOYMENT BEHAVIOR RULES
# =========================

execution_rules:

  prioritization:
    - "core_equity"
    - "equity_growth"
    - "high_beta"

  max_deployment_per_event: 0.15
  
  # =========================
  # Controls whether multiple crash-deployment levels can be combined or stacked.
  # false — no stacking: A deeper drawdown selects the applicable level rather than adding the percentages from all earlier levels. For example, at −30%, the deployment would be 8%, not \(3\%+5\%+8\%=16\%\).
  # true — stacking allowed: Could permit successive levels to accumulate, potentially deploying 16% by Level 3, if the implementation defines stacking that way.
  # =========================
  allow_stacking: false
  
  # =========================
  # Intended to require confirmation of a market cycle before a crash deployment is allowed.
  # true: Intended to require confirmation.
  # false: Intended to allow deployment without that confirmation requirement.
  # =========================
  require_confirmed_cycle: true