# =========================
# CycleGuard Regime System
# Shared across ALL accounts
# =========================

regime_system:

  # =========================
  # SIGNAL DEFINITIONS
  # =========================
  signals:

    trend:
      inputs:
        - "SPY"
      method: "price_vs_sma"

      thresholds:
        bullish: 1.00      # above long-term trend
        neutral: 0.98
        bearish: 0.95


    breadth:
      inputs:
        - "XLC"
        - "XLY"
        - "XLP"
        - "XLE"
        - "XLF"
        - "XLV"
        - "XLI"
        - "XLB"
        - "XLRE"
        - "XLK"
        - "XLU"

      method: "percent_above_sma"

      thresholds:
        strong: 65
        neutral: 50
        weak: 35


    volatility:
      inputs:
        - "^VIX"

      method: "vix_level"

      thresholds:
        calm: 18
        elevated: 25
        stress: 35


    leadership:
      inputs:
        - "SMH"
        - "QQQ"
      method: "relative_strength"


    credit:
      inputs:
        - "JNK"
        - "SHY"
      method: "credit_spread_proxy"

    cape:
      inputs:
        - "CAPE"
      method: "valuation"
      thresholds:
        expensive: 30
        neutral: 25
        cheap: 20


  # =========================
  # REGIME DEFINITIONS
  # =========================
  regimes:

    RISK_ON:
      description: "Strong bullish environment with expanding risk appetite"

      conditions:
        trend: "bullish"
        breadth: "strong"
        volatility: "calm"


    TRANSITION:
      description: "Mixed signals, uncertain direction"

      conditions:
        trend: "neutral"
        breadth: "neutral"


    DEFENSIVE:
      description: "Risk-off environment, capital preservation mode"

      conditions:
        trend: "bearish"
        volatility: "elevated"


    CRISIS:
      description: "High stress, liquidity-driven selloffs"

      conditions:
        volatility: "stress"
        breadth: "weak"


  # =========================
  # DEFAULT FALLBACK
  # =========================
  fallback_regime: "TRANSITION"